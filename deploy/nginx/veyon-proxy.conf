# Shared by every location that forwards to the API workers.
proxy_http_version  1.1;
proxy_set_header    Host               $http_host;
proxy_set_header    X-Real-IP          $remote_addr;
proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header    X-Forwarded-Proto  $scheme;
proxy_set_header    Upgrade            $http_upgrade;
proxy_set_header    Connection         $connection_upgrade;

# A chat socket stays open for hours (the API pings it every 20 s, so it's
# never silent that long unless the other side is really gone).
proxy_read_timeout  1h;
proxy_send_timeout  1h;

# A worker restarting (or one that died) → try the next one.
proxy_next_upstream  error timeout http_502;
