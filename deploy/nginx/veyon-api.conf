# The API on the website's own address: /api/... and the live socket /ws.
# Sign-in, sign-up and one-time codes: slow enough to stop password guessing
# and code spamming (6 a minute per address, a short burst allowed).
location ~ ^/api/auth/(login|register|otp|contact/otp|reset/otp|reset/verify|reset/complete)$ {
    limit_req   zone=veyon_login  burst=10 nodelay;
    proxy_pass  http://veyon_api;
    include     veyon-proxy.conf;
}

location /api/ {
    proxy_pass  http://veyon_api;
    include     veyon-proxy.conf;
}

location = /ws {
    proxy_pass  http://veyon_api;
    include     veyon-proxy.conf;
}
