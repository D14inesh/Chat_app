# Shared by the HTTP and HTTPS server blocks.
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

location / {
    try_files $uri $uri/ /index.html;
}

# Always revalidate the app shell, config and service worker, so a redeploy
# (or a changed backend URL) shows up on the next load instead of a stale copy.
location ~* ^/(index\.html|config\.js|sw\.js|manifest\.json|version\.json)$ {
    add_header Cache-Control "no-cache";
}

location ~* \.(css|js)$ {
    add_header Cache-Control "no-cache";
}
