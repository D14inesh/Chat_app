<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can’t connect</title>
<style>
  :root { color-scheme: light dark; --bg:#f3f2ef; --text:#1c1b19; --dim:#57534e; --accent:#4263eb; --tile:#e3e9ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0f11; --text:#ececee; --dim:#a1a1aa; --accent:#91a7ff; --tile:#1c2140; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text);
         font:16px/1.5 Inter, "Segoe UI", system-ui, sans-serif; }
  main { max-width:380px; text-align:center; }
  .icon { width:72px; height:72px; margin:0 auto 20px; border-radius:22px; display:grid; place-items:center; background:var(--tile); color:var(--accent); }
  .icon svg { width:34px; height:34px; }
  h1 { margin:0 0 8px; font-size:22px; letter-spacing:-.02em; }
  p { margin:0 0 22px; color:var(--dim); font-size:14.5px; }
  button { min-width:160px; padding:13px 22px; border:0; border-radius:99px; background:var(--accent); color:#fff; font:600 14.5px inherit; cursor:pointer; }
</style>
</head>
<body>
<main>
  <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/><path d="M3 3l18 18"/></svg></div>
  <h1>Can’t connect right now</h1>
  <p>Check your internet connection. Your messages are safe and will be here when you’re back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>addEventListener('online', () => location.reload());</script>
</body>
</html>
